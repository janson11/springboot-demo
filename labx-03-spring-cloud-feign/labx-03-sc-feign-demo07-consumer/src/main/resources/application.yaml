spring:
  application:
    name: demo-consumer
  cloud:
    nacos:
      discovery:
        # Nacos 作为注册中心的配置项，对应 NacosDiscoveryProperties 配置类
        server-addr: http://dev-internal.nacos2.codemao.cn:8848
    loadbalancer:
      retry:
        enabled: true

#    loadbalancer:
# Spring Cloud Loadbalancer 重启配置，对应 LoadBalancerRetryProperties 配置类
#      retry:
#        enabled: true # 是否开启重启，默认为 false 关闭重试

server:
  port: 28080

ribbon:
  ConnectTimeout: 1000 # 请求的连接超时时间，单位：毫秒。默认为 1000
  ReadTimeout: 10000 # 请求的读取超时时间，单位：毫秒。默认为 1000
  OkToRetryOnAllOperations: true # 是否对所有操作都进行重试，默认为 false 只对失败的操作进行重试
  MaxAutoRetries: 0 # 最大自动重试次数，默认为 0 不进行自动重试
  MaxAtuoRetriesNextServer: 1 # 重新选择服务实例的次数，默认为 1 次。注意，不包含第 1 次哈