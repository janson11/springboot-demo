spring:
  application:
    name: demo-consumer
  cloud:
    nacos:
      discovery:
        # Nacos 作为注册中心的配置项，对应 NacosDiscoveryProperties 配置类
        server-addr: http://dev-internal.nacos2.codemao.cn:8848

server:
  port: 28080


logging:
  level:
    com.janson.springcloud.labx03.feigndemo.consumer.feign: DEBUG

feign:
  # Feign 客户端配置，对应 FeignClientProperties 配置属性类
  client:
    # config 配置项是 Map 类型。key 为 Feign 客户端的名字，value 为 FeignClientConfiguration 对
    config:
      # 全局级别配置
      default:
        loggerLevel: BASIC
      # 客户端级别配置
      demo-provider:
        loggerLevel: FULL